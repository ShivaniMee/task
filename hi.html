```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Moon 🌙</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            background: #000;

            color: white;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* ================= STARS ================= */

        .stars {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }

        .star {
            position: absolute;

            width: 2px;
            height: 2px;

            background: white;

            border-radius: 50%;

            box-shadow: 0 0 7px white;

            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {

            from {
                opacity: 0.2;
            }

            to {
                opacity: 1;
            }
        }


        /* ================= CENTER REALISTIC MOON ================= */

        .center-moon {
            position: absolute;

            top: 8%;
            left: 50%;

            transform: translateX(-50%);

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background-image: url(
                "https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Moon_texture.jpg/960px-Moon_texture.jpg"
            );

            background-size: cover;

            background-position: center;

            box-shadow:
                0 0 25px rgba(255,255,255,0.8),
                0 0 60px rgba(255,255,255,0.35);

            z-index: 3;
        }


        /* ================= RIGHT HALF MOON ================= */

        .right-moon {
            position: absolute;

            right: 8%;
            top: 12%;

            width: 65px;
            height: 65px;

            border-radius: 50%;

            background: #fffde7;

            box-shadow:
                0 0 12px rgba(255,255,255,0.8),
                0 0 25px rgba(255,255,255,0.25);

            z-index: 3;

            overflow: hidden;
        }

        /*
            Black circle over the left side
            creates a static half-moon / crescent.
        */

        .right-moon::after {

            content: "";

            position: absolute;

            width: 65px;
            height: 65px;

            border-radius: 50%;

            background: #000;

            left: -22px;
            top: 0;
        }


        /* ================= MAIN CARD ================= */

        .container {
            position: relative;

            width: 90%;
            max-width: 600px;

            padding: 40px 30px;

            text-align: center;

            background: rgba(255,255,255,0.04);

            border: 1px solid rgba(255,255,255,0.15);

            border-radius: 25px;

            backdrop-filter: blur(10px);

            box-shadow:
                0 0 40px rgba(255,255,255,0.05);

            z-index: 10;
        }


        /* ================= TITLE ================= */

        h1 {

            font-size: 52px;

            margin-bottom: 18px;

            text-shadow:
                0 0 10px white,
                0 0 25px rgba(255,255,255,0.7);
        }


        /* ================= QUESTION ================= */

        .question {

            font-size: 24px;

            margin: 20px 0 30px;

            color: #eee;
        }


        /* ================= BUTTONS ================= */

        .buttons {

            display: flex;

            justify-content: center;

            gap: 20px;
        }

        button {

            padding: 13px 35px;

            border-radius: 30px;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.4);

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            background: white;

            color: black;

            transform: scale(1.05);

            box-shadow:
                0 0 20px white;
        }


        /* ================= RESPONSE ================= */

        #response {

            display: none;

            margin-top: 30px;

            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #responseTitle {

            font-size: 28px;

            margin-bottom: 15px;
        }

        #responseMessage {

            font-size: 18px;

            line-height: 1.8;

            color: #ddd;
        }


        /* ================= MUSIC ================= */

        #music {

            display: none;

            margin-top: 25px;
        }

        #music p {

            margin-bottom: 12px;
        }

        audio {

            width: 100%;

            max-width: 350px;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .center-moon {

                width: 130px;
                height: 130px;

                top: 5%;
            }

            .right-moon {

                width: 45px;
                height: 45px;

                right: 7%;
                top: 8%;
            }

            .right-moon::after {

                width: 45px;
                height: 45px;

                left: -15px;
            }

            .container {

                padding: 35px 20px;
            }

            h1 {

                font-size: 40px;
            }

            .question {

                font-size: 20px;
            }

            button {

                padding: 12px 25px;

                font-size: 16px;
            }
        }

    </style>
</head>


<body>


    <!-- ================= STARS ================= -->

    <div class="stars" id="stars"></div>


    <!-- ================= CENTER FULL MOON ================= -->

    <div class="center-moon"></div>


    <!-- ================= RIGHT HALF MOON ================= -->

    <div class="right-moon"></div>


    <!-- ================= MAIN CONTENT ================= -->

    <div class="container">

        <h1>🌙 Moon</h1>

        <div class="question">
            How are you feeling today?
        </div>


        <div class="buttons">

            <button onclick="yesClicked()">
                Yes 😊
            </button>

            <button onclick="noClicked()">
                No 🤍
            </button>

        </div>


        <!-- ================= RESPONSE ================= -->

        <div id="response">

            <h2 id="responseTitle"></h2>

            <p id="responseMessage"></p>


            <!-- ================= MUSIC ================= -->

            <div id="music">

                <p>
                    🎵 This little song is for you...
                </p>

                <audio id="song" controls>

                    <source
                        src="untill i found again.mp4"
                        type="audio/mpeg"
                    >

                    Your browser does not support audio.

                </audio>

            </div>

        </div>

    </div>


    <script>

        /* ================= CREATE STARS ================= */

        const stars =
            document.getElementById("stars");

        for (let i = 0; i < 160; i++) {

            const star =
                document.createElement("div");

            star.className = "star";

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            star.style.animationDelay =
                Math.random() * 3 + "s";

            star.style.animationDuration =
                (Math.random() * 3 + 1) + "s";

            stars.appendChild(star);
        }


        /* ================= YES ================= */

        function yesClicked() {

            const response =
                document.getElementById("response");

            const title =
                document.getElementById("responseTitle");

            const message =
                document.getElementById("responseMessage");

            const music =
                document.getElementById("music");


            title.innerHTML =
                "I'm glad to hear that 😊🌙";

            message.innerHTML =
                "Keep shining like, Moon.<br>" +
                "You deserve a beautiful day. ✨";


            response.style.display = "block";

            music.style.display = "none";
        }


        /* ================= NO ================= */

        function noClicked() {

            const response =
                document.getElementById("response");

            const title =
                document.getElementById("responseTitle");

            const message =
                document.getElementById("responseMessage");

            const music =
                document.getElementById("music");

            const song =
                document.getElementById("song");


            title.innerHTML =
                "Hey Moon... 🤍🌙";


            message.innerHTML =
                "It's okay if you're not feeling good right now.<br>" +
                "You don't have to pretend everything is okay.<br><br>" +
                "remember theres always a person whose availble for you"

            

            response.style.display =
                "block";

            music.style.display =
                "block";


            song.currentTime = 0;

            song.play().catch(function(error) {

                console.log(
                    "Music autoplay was blocked:",
                    error
                );

            });
        }

    </script>

</body>
</html>
